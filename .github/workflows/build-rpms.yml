name: Build RPMs

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [ disk-monitor, mount-watchdog, rsync-sync ]
    steps:
      - uses: actions/checkout@v4

      - name: Install rpmbuild
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Build ${{ matrix.pkg }} RPM
        run: |
          VERSION=""
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          mkdir -p "$HOME/rpmbuild"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp packaging/${{ matrix.pkg }}.spec "$HOME/rpmbuild/SPECS/"
          ARGS=(--define "_topdir $HOME/rpmbuild" --define "_sourcedir $PWD")
          [ -n "$VERSION" ] && ARGS+=(--define "_version $VERSION")
          rpmbuild -bb "${ARGS[@]}" "$HOME/rpmbuild/SPECS/${{ matrix.pkg }}.spec"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pkg }}-rpm
          path: ~/rpmbuild/RPMS/noarch/*.rpm
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: rpms

      - name: Attach RPMs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: rpms/*.rpm
