name: Build RPMs

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0). Used as the RPM Version and Release tag when not triggered by a v* tag. Leave empty for a date-based nightly tag.'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [ disk-monitor, mount-watchdog, rsync-sync ]
    steps:
      - uses: actions/checkout@v4

      - name: Install rpmbuild
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Build ${{ matrix.pkg }} RPM
        run: |
          VERSION=""
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          fi
          mkdir -p "$HOME/rpmbuild"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp packaging/${{ matrix.pkg }}.spec "$HOME/rpmbuild/SPECS/"
          ARGS=(--define "_topdir $HOME/rpmbuild" --define "_sourcedir $PWD")
          [ -n "$VERSION" ] && ARGS+=(--define "_version $VERSION")
          rpmbuild -bb "${ARGS[@]}" "$HOME/rpmbuild/SPECS/${{ matrix.pkg }}.spec"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pkg }}-rpm
          path: ~/rpmbuild/RPMS/noarch/*.rpm
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: rpms

      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=v${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=nightly-$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish RPMs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: RPMs ${{ steps.tag.outputs.tag }}
          files: rpms/*.rpm
          fail_on_unmatched_files: true
